<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="320">
  <defs>
    <!-- Cyan & Neon Ambient Glows -->
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="drop-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f2fe" flood-opacity="0.35" />
    </filter>

    <!-- Deep Tech Radial Background -->
    <radialGradient id="hudBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#002238" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#091420" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091b29" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06101a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Linear Dividers -->
    <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Progress Bar Gradient (Cyan) -->
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <!-- Progress Bar Gradient (Purple) -->
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <!-- Progress Bar Gradient (Green) -->
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="320" rx="12" fill="url(#hudBgGrad)" stroke="#004466" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <g stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" filter="url(#subtle-hud-glow)">
    <path d="M 18 35 L 18 18 L 35 18" />
    <circle cx="18" cy="18" r="2.5" fill="#00f2fe" />
    <path d="M 832 35 L 832 18 L 815 18" />
    <circle cx="832" cy="18" r="2.5" fill="#00f2fe" />
    <path d="M 18 285 L 18 302 L 35 302" />
    <circle cx="18" cy="302" r="2.5" fill="#00f2fe" />
    <path d="M 832 285 L 832 302 L 815 302" />
    <circle cx="832" cy="302" r="2.5" fill="#00f2fe" />
  </g>

  <!-- Top Status Bar -->
  <g fill="#38bdf8" font-family="'Segoe UI', Roboto, monospace" font-size="10" letter-spacing="1.8" opacity="0.85">
    <text x="35" y="38">◈ J.A.R.V.I.S. // TELEMETRY HUB MK-VII</text>
    <text x="815" y="38" text-anchor="end">STATUS: REAL-TIME LINK ACTIVE</text>
    <circle cx="823" cy="34" r="3.5" fill="#00e676" filter="url(#subtle-hud-glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <line x1="30" y1="48" x2="820" y2="48" stroke="url(#cyanLineGrad)" stroke-width="1.2" />

  <!-- ==================== LEFT CARD: TELEMETRY METRICS ==================== -->
  <g transform="translate(30, 62)">
    <rect width="250" height="236" rx="8" fill="url(#cardGrad)" stroke="#004466" stroke-width="1" />
    
    <!-- Header -->
    <text x="18" y="26" font-family="'Segoe UI', Roboto, monospace" font-weight="700" font-size="11" fill="#00f2fe" letter-spacing="1.5">
      CORE TELEMETRY
    </text>
    <line x1="18" y1="34" x2="232" y2="34" stroke="#004466" stroke-width="1" />

    <!-- Metric 1: Contributions -->
    <g transform="translate(18, 48)">
      <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#ffffff" filter="url(#drop-glow)">
        150<tspan fill="#00f2fe" font-size="20">+</tspan>
      </text>
      <text x="0" y="40" font-family="'Segoe UI', Roboto, monospace" font-size="9.5" fill="#94a3b8" letter-spacing="1">
        LIFETIME CONTRIBUTIONS
      </text>
    </g>

    <!-- Metric 2: Public Repos -->
    <g transform="translate(130, 48)">
      <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#ffffff" filter="url(#drop-glow)">
        04<tspan fill="#00f2fe" font-size="16"> REPOS</tspan>
      </text>
      <text x="0" y="40" font-family="'Segoe UI', Roboto, monospace" font-size="9.5" fill="#94a3b8" letter-spacing="1">
        OPEN SOURCE ARSENALS
      </text>
    </g>

    <line x1="18" y1="106" x2="232" y2="106" stroke="#00334d" stroke-width="1" stroke-dasharray="3, 3" />

    <!-- Metric 3: Experience & Tenure -->
    <g transform="translate(18, 122)">
      <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#38bdf8">
        4+ YEARS
      </text>
      <text x="0" y="32" font-family="'Segoe UI', Roboto, monospace" font-size="9.5" fill="#94a3b8" letter-spacing="1">
        ENGINEERING &amp; DESIGN TENURE
      </text>
    </g>

    <line x1="18" y1="168" x2="232" y2="168" stroke="#00334d" stroke-width="1" stroke-dasharray="3, 3" />

    <!-- Metric 4: Affiliation -->
    <g transform="translate(18, 184)">
      <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14" fill="#a855f7">
        NEXVEDA TECHNOLOGIES
      </text>
      <text x="0" y="32" font-family="'Segoe UI', Roboto, monospace" font-size="9.5" fill="#94a3b8" letter-spacing="1">
        PRIMARY ENTERPRISE AFFILIATION
      </text>
    </g>
  </g>

  <!-- ==================== CENTER CARD: ARC REACTOR RADAR ==================== -->
  <g transform="translate(295, 62)">
    <rect width="260" height="236" rx="8" fill="url(#cardGrad)" stroke="#004466" stroke-width="1" />
    
    <!-- Header -->
    <text x="130" y="26" text-anchor="middle" font-family="'Segoe UI', Roboto, monospace" font-weight="700" font-size="11" fill="#00f2fe" letter-spacing="1.5">
      TACTICAL READINESS
    </text>
    <line x1="20" y1="34" x2="240" y2="34" stroke="#004466" stroke-width="1" />

    <!-- Animated Arc Core Display -->
    <g transform="translate(130, 100)">
      <!-- Outer Dial -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4, 4" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite" />
      </circle>
      <!-- Middle Cyan Ring -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="24, 8" opacity="0.8" filter="url(#subtle-hud-glow)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite" />
      </circle>
      <!-- Inner Solid Ring -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#004466" stroke-width="2.5" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="140, 40" stroke-linecap="round" filter="url(#subtle-hud-glow)" />
      <!-- Pulsing Core -->
      <circle cx="0" cy="0" r="10" fill="#002238" stroke="#00f2fe" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#00f2fe" filter="url(#hud-glow)">
        <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Readiness Diagnostics Readout -->
    <g transform="translate(20, 168)" font-family="'Segoe UI', Roboto, monospace" font-size="10.5">
      <text x="0" y="14" fill="#94a3b8">ARC CORE EFFICIENCY:</text>
      <text x="220" y="14" text-anchor="end" fill="#00f2fe" font-weight="700">100% NOMINAL</text>

      <text x="0" y="34" fill="#94a3b8">SECURITY CLEARANCE:</text>
      <text x="220" y="34" text-anchor="end" fill="#00e676" font-weight="700">LEVEL 7</text>

      <text x="0" y="54" fill="#94a3b8">SYSTEM DIRECTIVE:</text>
      <text x="220" y="54" text-anchor="end" fill="#38bdf8" font-weight="700">ACTIVE // DEV</text>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: LANGUAGE & DOMAIN BREAKDOWN ==================== -->
  <g transform="translate(570, 62)">
    <rect width="250" height="236" rx="8" fill="url(#cardGrad)" stroke="#004466" stroke-width="1" />
    
    <!-- Header -->
    <text x="18" y="26" font-family="'Segoe UI', Roboto, monospace" font-weight="700" font-size="11" fill="#00f2fe" letter-spacing="1.5">
      ARSENAL BREAKDOWN
    </text>
    <line x1="18" y1="34" x2="232" y2="34" stroke="#004466" stroke-width="1" />

    <!-- Language 1: TypeScript -->
    <g transform="translate(18, 52)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, monospace" font-weight="700" font-size="10.5" fill="#ffffff">
        TypeScript
      </text>
      <text x="214" y="0" text-anchor="end" font-family="'Segoe UI', Roboto, monospace" font-size="10" fill="#00f2fe">
        45%
      </text>
      <rect y="6" width="214" height="6" rx="3" fill="#002238" />
      <rect y="6" width="96" height="6" rx="3" fill="url(#barCyan)" filter="url(#subtle-hud-glow)" />
    </g>

    <!-- Language 2: JavaScript -->
    <g transform="translate(18, 94)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, monospace" font-weight="700" font-size="10.5" fill="#ffffff">
        JavaScript
      </text>
      <text x="214" y="0" text-anchor="end" font-family="'Segoe UI', Roboto, monospace" font-size="10" fill="#38bdf8">
        30%
      </text>
      <rect y="6" width="214" height="6" rx="3" fill="#002238" />
      <rect y="6" width="64" height="6" rx="3" fill="url(#barCyan)" opacity="0.85" />
    </g>

    <!-- Language 3: UI/UX & Figma -->
    <g transform="translate(18, 136)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, monospace" font-weight="700" font-size="10.5" fill="#ffffff">
        UI/UX &amp; Design Systems
      </text>
      <text x="214" y="0" text-anchor="end" font-family="'Segoe UI', Roboto, monospace" font-size="10" fill="#a855f7">
        95%
      </text>
      <rect y="6" width="214" height="6" rx="3" fill="#002238" />
      <rect y="6" width="203" height="6" rx="3" fill="url(#barPurple)" filter="url(#subtle-hud-glow)" />
    </g>

    <!-- Language 4: Modern CSS / Tailwind -->
    <g transform="translate(18, 178)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, monospace" font-weight="700" font-size="10.5" fill="#ffffff">
        CSS3 / Tailwind
      </text>
      <text x="214" y="0" text-anchor="end" font-family="'Segoe UI', Roboto, monospace" font-size="10" fill="#10b981">
        25%
      </text>
      <rect y="6" width="214" height="6" rx="3" fill="#002238" />
      <rect y="6" width="53" height="6" rx="3" fill="url(#barGreen)" />
    </g>
  </g>

  <!-- Bottom Scanline & Sub-caption -->
  <line x1="30" y1="305" x2="820" y2="305" stroke="url(#cyanLineGrad)" stroke-width="1" opacity="0.5" />
</svg>
