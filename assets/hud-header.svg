<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="340">
  <defs>
    <!-- Cyan & Neon Ambient Glows -->
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="drop-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f2fe" flood-opacity="0.35" />
    </filter>

    <!-- Deep Tech Radial Background -->
    <radialGradient id="hudBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#002238" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#091420" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091b29" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06101a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Linear Dividers -->
    <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="80%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Progress Bar Gradient (Cyan) -->
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <!-- Progress Bar Gradient (Purple) -->
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <!-- Progress Bar Gradient (Green) -->
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="880" height="340" rx="12" fill="url(#hudBgGrad)" stroke="#004466" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <g stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8" filter="url(#subtle-hud-glow)">
    <path d="M 14 32 L 14 14 L 32 14" />
    <circle cx="14" cy="14" r="2" fill="#00f2fe" />
    <path d="M 866 32 L 866 14 L 848 14" />
    <circle cx="866" cy="14" r="2" fill="#00f2fe" />
    <path d="M 14 308 L 14 326 L 32 326" />
    <circle cx="14" cy="326" r="2" fill="#00f2fe" />
    <path d="M 866 308 L 866 326 L 848 326" />
    <circle cx="866" cy="326" r="2" fill="#00f2fe" />
  </g>

  <!-- Top Status Bar -->
  <g fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" letter-spacing="1.5" opacity="0.9">
    <text x="32" y="32">◈ J.A.R.V.I.S. // TELEMETRY HUB MK-VII</text>
    <text x="836" y="32" text-anchor="end">STATUS: REAL-TIME LINK ACTIVE</text>
    <circle cx="848" cy="28" r="3.5" fill="#00e676" filter="url(#subtle-hud-glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <line x1="26" y1="44" x2="854" y2="44" stroke="url(#cyanLineGrad)" stroke-width="1.2" />

  <!-- ==================== LEFT CARD: TELEMETRY METRICS ==================== -->
  <g transform="translate(26, 56)">
    <rect width="264" height="254" rx="8" fill="url(#cardGrad)" stroke="#004466" stroke-width="1" />
    
    <!-- Header -->
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#00f2fe" letter-spacing="1.5">
      CORE TELEMETRY
    </text>
    <line x1="16" y1="32" x2="248" y2="32" stroke="#004466" stroke-width="1" />

    <!-- Two-column metrics row: Contributions & Repos -->
    <!-- Col 1: Contributions -->
    <g transform="translate(16, 46)">
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" filter="url(#drop-glow)">
        150<tspan fill="#00f2fe" font-size="18">+</tspan>
      </text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="0.8">
        CONTRIBUTIONS
      </text>
    </g>

    <!-- Col 2: Public Repos -->
    <g transform="translate(136, 46)">
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" filter="url(#drop-glow)">
        04<tspan fill="#00f2fe" font-size="14"> REPOS</tspan>
      </text>
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="0.8">
        PUBLIC CODEBASES
      </text>
    </g>

    <line x1="16" y1="98" x2="248" y2="98" stroke="#00334d" stroke-width="1" stroke-dasharray="3, 3" />

    <!-- Metric 3: Experience & Tenure -->
    <g transform="translate(16, 110)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#38bdf8">
        4+ YEARS
      </text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="0.8">
        ENGINEERING &amp; DESIGN TENURE
      </text>
    </g>

    <line x1="16" y1="156" x2="248" y2="156" stroke="#00334d" stroke-width="1" stroke-dasharray="3, 3" />

    <!-- Metric 4: Affiliation -->
    <g transform="translate(16, 168)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#a855f7">
        NEXVEDA TECHNOLOGIES
      </text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="0.8">
        PRIMARY ENTERPRISE AFFILIATION
      </text>
    </g>

    <!-- Bottom Status Pill -->
    <g transform="translate(16, 214)">
      <rect width="232" height="24" rx="4" fill="#001a2b" stroke="#004466" stroke-width="0.8" />
      <text x="10" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.5">IDENTITY: VERIFIED DEV</text>
      <circle cx="218" cy="12" r="3" fill="#00e676" filter="url(#subtle-hud-glow)" />
    </g>
  </g>

  <!-- ==================== CENTER CARD: ARC REACTOR RADAR ==================== -->
  <g transform="translate(306, 56)">
    <rect width="268" height="254" rx="8" fill="url(#cardGrad)" stroke="#004466" stroke-width="1" />
    
    <!-- Header -->
    <text x="134" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#00f2fe" letter-spacing="1.5">
      TACTICAL READINESS
    </text>
    <line x1="16" y1="32" x2="252" y2="32" stroke="#004466" stroke-width="1" />

    <!-- Animated Arc Core Display -->
    <g transform="translate(134, 104)">
      <!-- Outer Dial -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4, 4" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite" />
      </circle>
      <!-- Middle Cyan Ring -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="24, 8" opacity="0.8" filter="url(#subtle-hud-glow)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite" />
      </circle>
      <!-- Inner Solid Ring -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="#004466" stroke-width="2.5" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="140, 40" stroke-linecap="round" filter="url(#subtle-hud-glow)" />
      <!-- Pulsing Core -->
      <circle cx="0" cy="0" r="10" fill="#002238" stroke="#00f2fe" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#00f2fe" filter="url(#hud-glow)">
        <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Readiness Diagnostics Readout -->
    <g transform="translate(18, 172)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">
      <text x="0" y="14" fill="#94a3b8" font-weight="600" letter-spacing="0.5">ARC CORE EFFICIENCY:</text>
      <text x="232" y="14" text-anchor="end" fill="#00f2fe" font-weight="700">100% NOMINAL</text>

      <text x="0" y="35" fill="#94a3b8" font-weight="600" letter-spacing="0.5">SECURITY CLEARANCE:</text>
      <text x="232" y="35" text-anchor="end" fill="#00e676" font-weight="700">LEVEL 7</text>

      <text x="0" y="56" fill="#94a3b8" font-weight="600" letter-spacing="0.5">SYSTEM DIRECTIVE:</text>
      <text x="232" y="56" text-anchor="end" fill="#38bdf8" font-weight="700">ACTIVE // DEV</text>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: LANGUAGE & DOMAIN BREAKDOWN ==================== -->
  <g transform="translate(590, 56)">
    <rect width="264" height="254" rx="8" fill="url(#cardGrad)" stroke="#004466" stroke-width="1" />
    
    <!-- Header -->
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#00f2fe" letter-spacing="1.5">
      ARSENAL BREAKDOWN
    </text>
    <line x1="16" y1="32" x2="248" y2="32" stroke="#004466" stroke-width="1" />

    <!-- Language 1: TypeScript -->
    <g transform="translate(16, 50)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#ffffff">
        TypeScript
      </text>
      <text x="232" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#00f2fe">
        45%
      </text>
      <rect y="7" width="232" height="6" rx="3" fill="#002238" />
      <rect y="7" width="104" height="6" rx="3" fill="url(#barCyan)" filter="url(#subtle-hud-glow)" />
    </g>

    <!-- Language 2: JavaScript -->
    <g transform="translate(16, 92)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#ffffff">
        JavaScript
      </text>
      <text x="232" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#38bdf8">
        30%
      </text>
      <rect y="7" width="232" height="6" rx="3" fill="#002238" />
      <rect y="7" width="70" height="6" rx="3" fill="url(#barCyan)" opacity="0.85" />
    </g>

    <!-- Language 3: UI/UX & Design Systems -->
    <g transform="translate(16, 134)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#ffffff">
        UI/UX Architecture
      </text>
      <text x="232" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#a855f7">
        95%
      </text>
      <rect y="7" width="232" height="6" rx="3" fill="#002238" />
      <rect y="7" width="220" height="6" rx="3" fill="url(#barPurple)" filter="url(#subtle-hud-glow)" />
    </g>

    <!-- Language 4: Modern CSS / Tailwind -->
    <g transform="translate(16, 176)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#ffffff">
        Tailwind CSS / Next.js
      </text>
      <text x="232" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#10b981">
        85%
      </text>
      <rect y="7" width="232" height="6" rx="3" fill="#002238" />
      <rect y="7" width="197" height="6" rx="3" fill="url(#barGreen)" />
    </g>

    <!-- Bottom sync indicator -->
    <g transform="translate(16, 226)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" letter-spacing="0.5">
      <text x="0" y="0" fill="#64748b">SOURCE: GITHUB REPOSITORIES</text>
      <text x="232" y="0" text-anchor="end" fill="#00f2fe" font-weight="700">SYNCED ◈</text>
    </g>
  </g>

  <!-- Bottom Scanline -->
  <line x1="26" y1="322" x2="854" y2="322" stroke="url(#cyanLineGrad)" stroke-width="1" opacity="0.5" />
</svg>
